; FreshWay Gateway Configuration
; Puerto en el que escucha este proxy (el que usa Cache)
port=8082

; Puerto del backend Green (MettlerWSV1.1_G.jar - Label Printer)
port_green=8083

; Puerto del backend Blue (MettlerWSV1.1_B.jar - Receipt/Linerless Printer)
port_blue=8084

; Timeout para los requests al backend en milisegundos
backend_timeout=30000
